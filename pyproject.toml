[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "boundary-lab-deploy"
version = "0.1.0rc4"
description = "Standalone loudspeaker deployment and BEAT Engine solve service"
readme = "README.md"
requires-python = ">=3.11"
license = {file = "LICENSE"}
dependencies = [
  "beat-engine @ https://github.com/Veeesop/BEAT_Engine/releases/download/v0.4.0rc1/beat_engine-0.4.0rc1-py3-none-any.whl#sha256=8bba352f925a709fe9aa8546c50dc1f173cf6f2b5b9ea479300cf0c9fb25b267",
  "numpy", "meshio",
]

[project.optional-dependencies]
dev = ["pytest", "ruff>=0.15,<0.16", "build"]

[project.scripts]
boundary-deploy-worker = "boundary_deploy.worker:main"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/boundary_deploy"]

[tool.hatch.build.targets.sdist]
exclude = [
  "/.venv",
  "/.venv-*",
  "/.idea",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]
